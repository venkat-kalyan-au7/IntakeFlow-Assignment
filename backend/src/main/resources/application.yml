spring:
  application.name: intakeflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/intakeflow?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:intakeflow}
    password: ${SPRING_DATASOURCE_PASSWORD:intakeflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 1
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  error.include-message: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /api/openapi
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /api-docs
app:
  jwt:
    issuer: intakeflow
    secret: ${JWT_SECRET:local-development-secret-change-before-production-32chars}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  demo-mode: ${APP_DEMO_MODE:true}
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${APP_BOOTSTRAP_ADMIN_NAME:IntakeFlow Administrator}
    requester:
      email: ${APP_BOOTSTRAP_REQUESTER_EMAIL:}
      password: ${APP_BOOTSTRAP_REQUESTER_PASSWORD:}
      display-name: ${APP_BOOTSTRAP_REQUESTER_NAME:IntakeFlow Requester}
    reviewer:
      email: ${APP_BOOTSTRAP_REVIEWER_EMAIL:}
      password: ${APP_BOOTSTRAP_REVIEWER_PASSWORD:}
      display-name: ${APP_BOOTSTRAP_REVIEWER_NAME:IntakeFlow Reviewer}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:4200}
